name: One-time Seed (initial ideas + calendar)

on:
  workflow_dispatch: {}   # manual only — run this once after setup, from GitHub's Actions tab (works from the mobile app too)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python orchestrator.py seed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit initial ideas + calendar
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Seed initial ideas + calendar"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push attempt $i failed (likely a concurrent workflow run), retrying..."
            sleep $((RANDOM % 8 + 3))
          done
          echo "Failed to push after 5 attempts"
          exit 1
