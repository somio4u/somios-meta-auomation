name: One-time Seed (initial ideas + calendar)

on:
  workflow_dispatch: {}   # manual only — run this once after setup, from GitHub's Actions tab (works from the mobile app too)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python orchestrator.py seed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
      - name: Commit initial ideas + calendar
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Seed initial ideas + calendar"
          git push
